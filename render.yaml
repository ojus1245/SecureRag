# ============================================
# Render Blueprint for SecureRAG
# https://render.com/docs/blueprint-spec
# ============================================
services:
  # --------------------------------------------
  # 1. AI Microservice (FastAPI + ChromaDB)
  # --------------------------------------------
  - type: web
    name: securerag-ai-service
    runtime: python
    rootDir: ai-service
    plan: free
    region: oregon
    buildCommand: "pip install -r requirement.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: ROUTING_RULE
        value: external_only
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false # Set in Render Dashboard
      - key: AI_SERVICE_API_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: EMBEDDING_DIMENSIONS
        value: 384

  # --------------------------------------------
  # 2. Backend API Gateway (Node.js / Express)
  # --------------------------------------------
  - type: web
    name: securerag-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: "npm install --omit=dev"
    startCommand: "node src/server.js"
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard (e.g. MongoDB Atlas mongodb+srv://...)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: securerag-ai-service
          property: host
      - key: AI_SERVICE_API_KEY
        fromService:
          type: web
          name: securerag-ai-service
          envVarKey: AI_SERVICE_API_KEY
      - key: CORS_ORIGIN
        value: "*" # Or your frontend onrender.com URL

  # --------------------------------------------
  # 3. Frontend Web App (React / Vite Static Site)
  # --------------------------------------------
  - type: web
    name: securerag-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: securerag-backend
          property: host
